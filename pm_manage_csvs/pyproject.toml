[project]
name = "pm-manage-csvs"
version = "0.1.0"
description = "MCP server exposing Google-Sheets-backed CSV storage for the pm Hermes agent"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "mcp[cli]>=1.10,<2.0",
    "google-api-python-client>=2.150,<3.0",
    "google-auth>=2.35,<3.0",
    "pydantic>=2.8,<3.0",
    "pyyaml>=6.0,<7.0",
    "structlog>=24.4,<25.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "freezegun>=1.5,<2.0",
]

[project.scripts]
pm-manage-csvs = "pm_manage_csvs.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pm_manage_csvs"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501", "N802"]  # line-length handled by formatter; N802 — Google API uses camelCase

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
